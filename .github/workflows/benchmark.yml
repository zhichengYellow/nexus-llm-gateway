name: Daily Benchmark

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Run offline benchmark
        run: node benchmark/offline-benchmark.mjs | tee benchmark-output.txt

      - name: Update README with benchmark results
        run: |
          node -e "
          const fs = require('fs');
          const bench = fs.readFileSync('benchmark-output.txt', 'utf8').trim();
          const readme = fs.readFileSync('README.md', 'utf8');
          const start = '<!-- BENCHMARK_START -->';
          const end = '<!-- BENCHMARK_END -->';
          const date = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
          const block = start + '\n```\n' + bench + '\n```\n\n> 更新于 ' + date + '\n' + end;
          const re = new RegExp(start + '[\\s\\S]*' + end, 'm');
          if (re.test(readme)) {
            fs.writeFileSync('README.md', readme.replace(re, block));
            console.log('README updated with benchmark results');
          } else {
            console.log('Benchmark markers not found in README, skipping update');
          }
          "

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update benchmark results [skip ci]"
          git push
